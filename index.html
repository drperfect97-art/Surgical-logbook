<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>Surgical Logbook</title>
</head>
<body>
<div id="app">
  <header class="topbar"><div><div class="eyebrow">SURGICAL LOGBOOK</div><h1>Cases</h1></div><div class="top-actions"><span id="syncBadge" class="badge">Offline</span><button id="logoutBtn" class="iconbtn hidden">↪</button></div></header>
  <main>
    <section id="authView" class="panel auth-panel">
      <h2>Sign in</h2><p class="muted">Your cases sync to your private Supabase account.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="primary">Sign in</button><button id="signupBtn" class="secondary">Create account</button><p id="authMsg" class="msg"></p>
    </section>
    <section id="mainView" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="toolbar"><input id="search" placeholder="Search procedure, diagnosis, consultant…"><button id="addBtn" class="primary small">＋ Add Case</button></div>
      <div class="filters"><select id="roleFilter"><option value="">All roles</option><option>Primary</option><option>First Assistant</option><option>Second Assistant</option><option>Observer</option></select><select id="typeFilter"><option value="">All types</option><option>Elective</option><option>Emergency</option></select><select id="monthFilter"><option value="">All dates</option></select></div>
      <div id="caseList" class="case-list"></div>
    </section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Add Case</h2><button id="closeModal" class="iconbtn">×</button></div><form id="caseForm"><input type="hidden" id="caseId"><div class="grid two"><label>Case ID<input id="caseNumber" readonly placeholder="Auto-generated"></label><label>Patient name (optional)<input id="patientName"></label></div><div class="grid three"><label>Age<input id="age" type="number" min="0"></label><label>Sex<select id="sex"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>CR / UHID<input id="crUhid"></label></div><div class="grid three"><label>Admission date<input id="admissionDate" type="date"></label><label>Surgery date<input id="surgeryDate" type="date"></label><label>Discharge date<input id="dischargeDate" type="date"></label></div><div class="grid three"><label>Ward / Unit<input id="wardUnit"></label><label>Case type<select id="caseType"><option>Elective</option><option>Emergency</option></select></label><label>My role<select id="myRole"><option>Primary</option><option>First Assistant</option><option>Second Assistant</option><option>Observer</option></select></label></div><label>Pre-op diagnosis<textarea id="preopDiagnosis"></textarea></label><label>Post-op diagnosis<textarea id="postopDiagnosis"></textarea></label><div class="grid two"><label>Procedure<input id="procedureName" required placeholder="e.g. Laparoscopic cholecystectomy"></label><label>Procedure category<input id="procedureCategory" placeholder="e.g. HPB / Colorectal"></label></div><div class="grid three"><label>Approach<select id="approach"><option>Open</option><option>Laparoscopic</option><option>Endoscopic</option><option>Robotic</option><option>Other</option></select></label><label>Consultant / Supervisor<input id="consultant"></label><label>Primary surgeon<input id="primarySurgeon"></label></div><label>Assistant surgeon(s)<input id="assistants"></label><label>Anaesthesia<input id="anaesthesia"></label><label>Operative findings<textarea id="findings"></textarea></label><label>Complications<textarea id="complications"></textarea></label><div class="grid three"><label>Complexity<select id="complexity"><option>Routine</option><option>Moderate</option><option>Complex</option><option>Major</option></select></label><label>Supervision<select id="supervision"><option>Independent</option><option>Directly supervised</option><option>Indirectly supervised</option></select></label><label>Outcome<select id="outcome"><option>Stable</option><option>ICU</option><option>Re-exploration</option><option>Death</option><option>Other</option></select></label></div><div class="grid two"><label>Blood loss (mL)<input id="bloodLoss" type="number" min="0"></label><label>Drains<input id="drains"></label></div><label>Specimen<input id="specimen"></label><div class="grid three"><label>HPE number<input id="hpeNumber"></label><label>HPE diagnosis<input id="hpeDiagnosis"></label><label>HPE sent date<input id="hpeSentDate" type="date"></label></div><label>Additional remarks<textarea id="remarks"></textarea></label><div class="attach"><div><b>Photos / HPE reports</b><div class="muted smalltext">Select multiple files. Uploads are private.</div></div><input id="attachments" type="file" accept="image/*,.pdf" multiple></div><div id="attachmentPreview" class="preview"></div><div class="form-actions"><button type="button" id="cancelBtn" class="secondary">Cancel</button><button class="primary" type="submit">Save Case</button></div><p id="formMsg" class="msg"></p></form></div></div>
<div id="detailModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="detailTitle"></h2><button id="closeDetail" class="iconbtn">×</button></div><div id="detailBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</body></html>
